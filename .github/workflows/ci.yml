name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub-hosted runners ship git preinstalled — gitManager's tests shell out
# to the real binary against local temp repos, no network/remote needed.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
